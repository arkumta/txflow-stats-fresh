name: Collect Txflow market snapshots

on:
  schedule:
    # Run hourly, independent of the developer's Mac being online.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect market snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://txflow-stats-fresh.vercel.app/api/collect-market"
